
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>JavaScript Day Tasks</h1>

    <section>
        <h2>Question 2: Currency Exchange</h2>
        <button onclick="testExchange()">Exchange Currency</button>
    </section>

    <section>
        <h2>Question 3: Numbers from 1 to 20</h2>
        <button onclick="printNumbers()">Print Numbers</button>
        <p>Open the browser console using F12 to see the result.</p>
    </section>

    <section>
        <h2>Question 4: User Information</h2>
        <button onclick="getUserInfo()">Enter Your Information</button>
        <div id="userInfo"></div>
    </section>

    <section>
        <h2>Question 5: Equal Numbers</h2>
        <button onclick="testEqualFunc()">Test Equal Function</button>
    </section>

    <section>
        <h2>Question 6: Sum of Numbers</h2>
        <button onclick="calculateSum()">Start Sum</button>
    </section>

    <section>
        <h2>Question 7: Display Headings</h2>
        <button onclick="displayHeadings()">Enter Message</button>
        <div id="headings"></div>
    </section>
</body>
</html>
